<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cotizador · Monky Agency</title>
<style>
:root{--bg:#FAF8EF;--ink:#34421D;--muted:#6B7556;--line:#D9DCC8;--card:#FFFFFF;--err:#A3471A;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#1C2210;--ink:#EEF0E2;--muted:#A9B193;--line:#3A4425;--card:#252C17;--err:#F3B48A;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Georgia,serif;padding:24px}
form{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 32px}
h1{font-weight:400;font-size:40px;line-height:1.05;margin-bottom:8px}
p{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;color:var(--muted);margin-bottom:22px}
label{display:block;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;background:var(--bg);color:var(--ink)}
.rem{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
button{width:100%;height:50px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:600 16px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid #DE6E27;outline-offset:2px}
.err{font-family:system-ui,sans-serif;font-size:14px;color:var(--err);min-height:20px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Cotizador Tienda Nube</h1>
  <p>Herramienta interna de Monky Agency. Ingresá la contraseña del equipo.</p>
  <label for="pw">Contraseña</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <label class="rem"><input type="checkbox" id="rem"> Recordarme en esta computadora</label>
  <button type="submit" id="go">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</form>

  var KEY = 'monky-cotizador-pw';
  var u8 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  async function unlock(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(DATA.s), iterations:DATA.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);

    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Entrando…';
    var pw = document.getElementById('pw').value;
    try {
      var html = await unlock(pw);
      try { if (document.getElementById('rem').checked) localStorage.setItem(KEY, pw); } catch(x) {}
      show(html);
    } catch(x) {
      go.disabled = false; go.textContent = 'Entrar';
      err.textContent = 'Contraseña incorrecta. Revisala y probá de nuevo.';

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) unlock(saved).then(show).catch(function(){ localStorage.removeItem(KEY); });
